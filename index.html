<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian Standar Harga Satuan (SSH)</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css" rel="stylesheet">
    
    <style>
        body { 
            background-color: #f4f7f6; 
            padding-top: 30px;
            padding-bottom: 50px;
        }
        .container { 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }
        h2 { 
            color: #2c3e50; 
            font-weight: 700; 
            text-align: center; 
            margin-bottom: 30px;
        }
        .table th {
            background-color: #34495e;
            color: white;
            text-align: center;
        }
        .table td {
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Pencarian Database SSH 2026</h2>
        <hr>
        <div class="table-responsive">
            <table id="tabelSSH" class="table table-striped table-hover table-bordered dt-responsive nowrap" style="width:100%">
                <thead>
                    <tr>
                        <th>Kelompok Barang</th>
                        <th>Kode Barang</th>
                        <th>Uraian Barang</th>
                        <th>Spesifikasi</th>
                        <th>Satuan</th>
                        <th>Harga Satuan (Rp)</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>

    <script>
        $(document).ready(function() {
            $('#tabelSSH').DataTable({
                ajax: {
                    url: 'data.json', // Memuat data dari file JSON terpisah
                    dataSrc: ''
                },
                columns: [
                    { data: 'URAIAN KELOMPOK BARANG' },
                    { data: 'KODE BARANG' },
                    { data: 'URAIAN BARANG' },
                    { data: 'SPESIFIKASI' },
                    { data: 'SATUAN' },
                    { 
                        data: 'HARGA SATUAN',
                        render: $.fn.dataTable.render.number('.', ',', 0, '')
                    }
                ],
                language: {
                    url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/id.json' // Bahasa Indonesia
                },
                pageLength: 25,
                responsive: true
            });
        });
    </script>
</body>
</html>
